<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/htmx.js"></script>
</head>
<body>
    <h2>Statistics</h2>
    <a href="/">Home</a>

        <thead>
