<div class="nes-container with-title is-rounded">
    <p class="title nes-text">Короткая ссылка</p>
    <input type="text" id="short-url" class="nes-input" readonly value="{{ short }}">
    <a class="nes-btn" href="{{ short }}">Перейти</a>
    <button class="nes-btn" onclick="navigator.clipboard.writeText('{{ short }}');">Копировать</button>
</div>
